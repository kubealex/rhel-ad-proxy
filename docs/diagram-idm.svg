<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="'Red Hat Display', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#cc0000"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6a6e73"/></marker>
  </defs>

  <!-- AD boxes -->
  <rect x="20" y="15" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="44" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (external)</text>

  <rect x="20" y="106" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="135" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (internal)</text>

  <rect x="20" y="197" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="226" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (company)</text>

  <!-- Lines converging -->
  <line x1="185" y1="39" x2="280" y2="130" stroke="#d2d2d2" stroke-width="1.5"/>
  <line x1="185" y1="130" x2="280" y2="130" stroke="#d2d2d2" stroke-width="1.5"/>
  <line x1="185" y1="221" x2="280" y2="130" stroke="#d2d2d2" stroke-width="1.5"/>

  <!-- Arrow to IdM -->
  <line x1="280" y1="130" x2="375" y2="130" stroke="#cc0000" stroke-width="2" marker-end="url(#aR)"/>

  <!-- Trust labels -->
  <text x="322" y="112" text-anchor="middle" fill="#6a6e73" font-size="11" font-weight="500">Kerberos</text>
  <text x="322" y="156" text-anchor="middle" fill="#6a6e73" font-size="10">Trusts (two-way)</text>

  <!-- IdM box -->
  <rect x="383" y="90" width="200" height="80" rx="6" fill="#cc0000"/>
  <text x="483" y="124" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">IdM Server</text>
  <text x="483" y="148" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85">Unified user resolution</text>

  <!-- Arrow from App -->
  <line x1="640" y1="130" x2="591" y2="130" stroke="#6a6e73" stroke-width="2" marker-end="url(#aG)"/>
  <text x="618" y="118" text-anchor="middle" fill="#6a6e73" font-size="11" font-weight="500">LDAP</text>

  <!-- App box -->
  <rect x="645" y="105" width="120" height="50" rx="6" fill="#393f42"/>
  <text x="705" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Application</text>
</svg>
