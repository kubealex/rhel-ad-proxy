<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" font-family="'Red Hat Display', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="aB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0066cc"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6a6e73"/></marker>
  </defs>

  <!-- AD boxes -->
  <rect x="20" y="20" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="49" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (external)</text>

  <rect x="20" y="131" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="160" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (internal)</text>

  <rect x="20" y="242" width="165" height="48" rx="6" fill="#393f42"/>
  <text x="102" y="271" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">AD (company)</text>

  <!-- LDAPS connections -->
  <line x1="185" y1="44" x2="332" y2="44" stroke="#0066cc" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="258" y="37" text-anchor="middle" fill="#6a6e73" font-size="10" font-weight="500">LDAPS</text>

  <line x1="185" y1="155" x2="332" y2="155" stroke="#0066cc" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="258" y="148" text-anchor="middle" fill="#6a6e73" font-size="10" font-weight="500">LDAPS</text>

  <line x1="185" y1="266" x2="332" y2="266" stroke="#0066cc" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="258" y="259" text-anchor="middle" fill="#6a6e73" font-size="10" font-weight="500">LDAPS</text>

  <!-- DS box -->
  <rect x="340" y="10" width="300" height="290" rx="6" fill="#0066cc"/>
  <text x="490" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">389 Directory Server</text>
  <text x="490" y="58" text-anchor="middle" fill="#fff" font-size="11" opacity="0.85">(proxy)</text>

  <!-- DIT structure area -->
  <rect x="360" y="74" width="260" height="110" rx="4" fill="rgba(255,255,255,0.12)"/>
  <text x="380" y="97" fill="#fff" font-size="12" font-weight="600">dc=example,dc=com</text>
  <text x="395" y="119" fill="#fff" font-size="11" font-family="monospace">├─ dc=external  → chain</text>
  <text x="395" y="141" fill="#fff" font-size="11" font-family="monospace">├─ dc=internal  → chain</text>
  <text x="395" y="163" fill="#fff" font-size="11" font-family="monospace">└─ dc=company   → chain</text>

  <!-- DS subtitle -->
  <text x="490" y="215" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">Chaining forwards each sub-suffix</text>
  <text x="490" y="230" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">to the matching AD domain over LDAPS</text>

  <!-- Arrow from App -->
  <line x1="700" y1="155" x2="648" y2="155" stroke="#6a6e73" stroke-width="2" marker-end="url(#aG)"/>
  <text x="676" y="143" text-anchor="middle" fill="#6a6e73" font-size="11" font-weight="500">LDAP</text>

  <!-- App box -->
  <rect x="705" y="130" width="135" height="50" rx="6" fill="#393f42"/>
  <text x="772" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Application</text>
</svg>
