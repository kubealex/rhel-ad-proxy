---
- name: Create the LDAP proxy service account on each AD domain
  hosts: windows_server
  gather_facts: false

  vars_files:
    - ../vars.yml

  tasks:
    - name: Find the domain of this host in ad_servers
      ansible.builtin.set_fact:
        ad_server: "{{ ad_servers | selectattr('ad_domain', 'equalto', inventory_hostname) | first }}"

    - name: Build the base DN of the domain
      ansible.builtin.set_fact:
        ad_base_dn: "DC={{ ad_server.ad_domain.split('.') | join(',DC=') }}"

    - name: Create the service account
      microsoft.ad.user:
        name: svc-ldapproxy
        sam_account_name: svc-ldapproxy
        upn: "svc-ldapproxy@{{ ad_server.ad_domain }}"
        description: "Read-only bind account for the LDAP chaining proxy"
        path: "CN=Users,{{ ad_base_dn }}"
        password: "{{ ds_proxy_bind_password }}"
        update_password: on_create
        password_never_expires: true
        user_cannot_change_password: true
        enabled: true
        state: present
      no_log: true

    - name: Read back the DN of the account
      ansible.windows.win_shell: "(Get-ADUser -Identity 'svc-ldapproxy').DistinguishedName"
      register: proxy_account_dn
      changed_when: false

    - name: Verify the account can authenticate
      ansible.windows.win_shell: |
        Add-Type -AssemblyName System.DirectoryServices.AccountManagement
        $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Domain', '{{ ad_server.ad_domain }}')
        $ctx.ValidateCredentials('svc-ldapproxy', '{{ ds_proxy_bind_password }}')
      register: auth_check
      changed_when: false
      failed_when: "'True' not in auth_check.stdout"
      no_log: true

    - name: Show proxy account details
      ansible.builtin.debug:
        msg:
          - "Domain:  {{ ad_server.ad_domain }}"
          - "BIND DN: {{ proxy_account_dn.stdout | trim }}"
